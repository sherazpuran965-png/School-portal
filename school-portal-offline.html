<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Portal</title>
<style>:root{--g:#1F3B33;--b:#B4884A}*{box-sizing:border-box}body{margin:0;font:15px "Noto Naskh Arabic","Noto Nastaliq Urdu",system-ui,sans-serif;background:#F5F1E7;color:#24211B}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}

@media(max-width:600px){input,select,textarea{font-size:16px}main{padding:8px}.card{padding:10px;border-radius:10px}
header{padding:8px 10px;gap:6px;flex-wrap:wrap}header>b,#brand{font-size:15px;min-width:0;flex:1 1 140px}header>small{display:none}header>span{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap;margin-inline-start:auto}header button{padding:5px 9px;font-size:13px}#who{font-size:12px;display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
#md{padding:8px!important}#md>.card{max-height:94vh!important;padding:10px}
#mt input{width:56px!important;padding:6px 3px;text-align:center}#mt td,#mt th{padding:4px 2px}}

.pi{display:inline-flex;align-items:center;justify-content:center;border-radius:28%;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 4px 10px rgba(0,0,0,.22),inset 0 1px 1px rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.18);flex:none}
.pi svg{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.phd{display:flex;align-items:center;gap:12px;padding:6px 4px 2px}.phd h2{margin:0;font-size:20px;color:var(--g)}.phd small{color:#7a705c}
.pgh{font-weight:700;color:var(--g);margin:16px 4px 8px;font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
button.ptile{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;color:#24211B;border-radius:16px;padding:14px 6px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:13px;font-weight:600;text-align:center;line-height:1.3;transition:transform .12s}
button.ptile:active{transform:scale(.95)}
button.hb{display:flex;align-items:center;gap:6px;background:#fff;color:var(--g);border:1px solid var(--g);padding:5px 10px 5px 6px}

<header><b id="brand"></b> <small data-k="first login: admin / admin123">first login: admin / admin123</small><span><button class="o" id="lg" onclick="setLang()"></button> <span id="who"></span></span></header><nav id="nav"></nav><div id="bk"></div><main id="app"></main>
<script>let T=localStorage.t,ROLE=localStorage.r,NAME=localStorage.n,tab='students';
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),month=()=>today().slice(0,7);

// ---- Local engine (data is saved inside this browser, no server) ----
let D=JSON.parse(localStorage.sp_db||'null')||{users:[],students:[],payments:[],att:{},rseq:0,seq:1};
const save=()=>{try{localStorage.sp_db=JSON.stringify(D)}catch(e){alert('Storage is full! Download a backup now and remove old photos.')}};
const nu=s=>String(s||'').trim().toLowerCase();D.users.forEach(u=>u.username=nu(u.username));
const PERM={fees:['admin','accountant'],att:['admin','teacher'],admin:['admin']};
async function H(p,s){try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return''+h}}
async function setUser(username,password,role,name){username=nu(username);password=String(password).trim();const salt=Math.random().toString(36).slice(2),hash=await H(password,salt),u=D.users.find(x=>x.username==username);
 if(u)Object.assign(u,{salt,hash,role,name:name||username});else D.users.push({username,salt,hash,role,name:name||username});save()}
async function api(p,o){
 const [path,qs]=p.split('?'),q=new URLSearchParams(qs||''),b=o||{},fail=m=>{alert(m);throw 0};
 if(!D.users.length)await setUser('admin','admin123','admin','Admin');
 if(path==='login'){const u=D.users.find(x=>x.username==nu(b.username));if(!u||await H(String(b.password||'').trim(),u.salt)!==u.hash)fail('Wrong username or password');return{token:'local',role:u.role,name:u.name}}
 if(!T)throw 0;
 const ok=k=>PERM[k].includes(ROLE)||fail('Not allowed for your role'),act=D.students.filter(s=>s.active);
 const srt=a=>a.sort((x,y)=>(x.class+x.name).localeCompare(y.class+y.name));
 if(path==='students'&&!o)return srt([...act]);
 if(path==='students'){ok('admin');if(!b.name)fail('Name required');const v={name:b.name,father:b.father||'',phone:b.phone||'',class:b.class||'',fee:+b.fee||0,disc:+b.disc||0,old:+b.old||0};if(b.photo)v.photo=b.photo;
  if(b.id)Object.assign(D.students.find(s=>s.id==b.id),v);else D.students.push({id:D.seq++,...v,admitted:today(),active:1});save();return{ok:1}}
 if(path==='students/delete'){ok('admin');D.students.find(s=>s.id==b.id).active=0;save();return{ok:1}}
 if(path==='fees'){ok('fees');return srt(act.map(s=>({...s,paid:D.payments.filter(x=>x.student_id==s.id&&x.month==q.get('month')).reduce((a,x)=>a+x.amount,0),oldpaid:D.payments.filter(x=>x.student_id==s.id&&x.month=='old').reduce((a,x)=>a+x.amount,0)})))}
 if(path==='pay'){ok('fees');if(!(+b.amount>0))fail('Invalid amount');const id=++D.rseq;D.payments.push({id,student_id:+b.student_id,month:b.month,amount:+b.amount,date:today(),by:NAME});save();return{receipt:id,date:today()}}
 if(path==='attendance'&&!o){ok('att');const d=D.att[q.get('date')]||{};return srt(act.map(s=>({id:s.id,name:s.name,class:s.class,status:d[s.id]||null})))}
 if(path==='attendance'){ok('att');D.att[b.date]=D.att[b.date]||{};for(const m of b.marks||[])D.att[b.date][m.id]=m.status;save();return{ok:1}}
 if(path==='att-report'){ok('att');const m=q.get('month');return srt(act.map(s=>{const r={name:s.name,class:s.class,p:0,a:0,l:0};
  for(const d in D.att)if(d.startsWith(m)){const x=D.att[d][s.id];if(x)r[x.toLowerCase()]++}return r}))}
 if(path==='history'){ok('fees');return D.payments.filter(x=>x.student_id==q.get('id')).sort((a,b)=>b.id-a.id)}
 if(path==='pay/delete'){ok('admin');D.payments=D.payments.filter(x=>x.id!=b.id);save();return{ok:1}}
 if(path==='pay/edit'){ok('admin');if(!(+b.amount>0))fail('Invalid amount');D.payments.find(x=>x.id==b.id).amount=+b.amount;save();return{ok:1}}
 if(path==='users'&&!o){ok('admin');return D.users.map(({username,name,role})=>({username,name,role}))}
 if(path==='users'){ok('admin');if(!b.username||!b.password||!['admin','teacher','accountant'].includes(b.role))fail('Username, password and role required');await setUser(b.username,b.password,b.role,b.name);return{ok:1}}
}
function logout(){['t','r','n'].forEach(k=>localStorage.removeItem(k));T=null;boot()}
const TABS={students:['Students',['admin','teacher','accountant']],fees:['Fees',['admin','accountant']],att:['Attendance',['admin','teacher']],admin:['Users & Backup',['admin']]};
function boot(){ $('#who').innerHTML=T?esc(NAME)+' ('+ROLE+') <button class="o" onclick="logout()">Logout</button>':'';
 if(!T){$('#nav').innerHTML='';$('#bk').innerHTML='';app.innerHTML=`<div class="card"><h3>Login</h3><div class="row"><input id="u" placeholder="Username" autocapitalize="none" autocorrect="off" spellcheck="false"><input id="p" type="password" placeholder="Password" autocapitalize="none" autocorrect="off"><button onclick="login()">Login</button></div><label><input type="checkbox" onchange="document.getElementById('p').type=this.checked?'text':'password'"> Show password</label></div>`;return}
 $('#nav').innerHTML=Object.entries(TABS).filter(([k,v])=>v[1].includes(ROLE)).map(([k,v])=>`<button class="${k==tab?'on':'o'}" onclick="tab='${k}';boot()">${v[0]}</button>`).join('');
 if(!TABS[tab][1].includes(ROLE))tab='students';$('#bk').innerHTML=(ROLE=='admin'&&D.students.length&&Date.now()-(D.lastBackup||0)>7*864e5)?'<div class="card" style="background:#F6E5E1;margin:8px">Last backup is more than 7 days old. <button onclick="dl();boot()">Download backup</button></div>':'';V[tab]()}
async function login(){const j=await api('login',{username:$('#u').value,password:$('#p').value});T=j.token;ROLE=j.role;NAME=j.name;
 localStorage.t=T;localStorage.r=ROLE;localStorage.n=NAME;boot()}
const V={
async students(){const L=await api('students'),adm=ROLE=='admin';window.L=L;
 app.innerHTML=(adm?`<div class="card"><h4 id="ft">Add student</h4><div class="row"><input id="n" placeholder="Name"><input id="f" placeholder="Father name"><input id="ph" placeholder="Phone"><input id="c" placeholder="Class"><input id="fe" type="number" placeholder="Monthly fee"><input id="di" type="number" placeholder="Discount per month"><input id="ol" type="number" placeholder="Old dues (purana baqaya)"><label>Photo: <input id="pf" type="file" accept="image/*"></label><button onclick="saveS()">Save</button></div></div>`:'')+
 `<div class="card"><input id="q" placeholder="Search..." oninput="filt()"><table id="tb"></table></div>`;filt()},
async fees(){const m=window.fm||month();const L=await api('fees?month='+m);window.FL=L;
 const te=s=>s.fee-(s.disc||0),od=s=>Math.max(0,(s.old||0)-s.oldpaid);
 app.innerHTML=`<div class="card"><div class="row"><input type="month" id="m" value="${m}" onchange="fm=this.value;boot()"></div><table><tr><th>Name</th><th>Class</th><th>Fee</th><th>Paid</th><th>Due</th><th>Old due</th><th></th></tr>`+
 L.map((s,i)=>{const d=te(s)-s.paid;return`<tr><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${te(s)}</td><td>${s.paid}</td><td class="${d>0?'due':'ok'}">${d>0?d:'Paid'}</td><td class="${od(s)?'due':''}">${od(s)||'-'}</td><td><button onclick="pay(${i})">Receive</button> ${od(s)?`<button class="o" onclick="pay(${i},1)">Old</button> `:''}<button class="o" onclick="hist(${i})">History</button></td></tr>`}).join('')+
 `</table><p><b>Due this month: ${L.reduce((a,s)=>a+Math.max(0,te(s)-s.paid),0)} | Old dues: ${L.reduce((a,s)=>a+od(s),0)}</b></p></div>`},
async att(){const d=window.ad||today();const L=await api('attendance?date='+d);window.AL=L;const cl=[...new Set(L.map(s=>s.class||''))].sort(natCmp);
 if(!cl.includes(window.AC))window.AC=cl[0];
 app.innerHTML=`<div class="card"><div class="row"><input type="date" id="d" value="${d}" onchange="ad=this.value;boot()"><button onclick="saveA()">Save attendance</button><button class="o" onclick="attRep()">Monthly report</button></div><div class="row">${cl.map(c=>`<button class="${c===AC?'on':'o'} sm" data-c="${esc(c)}" onclick="AC=this.dataset.c;boot()">${esc(c)||'-'} (${L.filter(s=>(s.class||'')===c).length})</button>`).join('')}</div><div class="row"><button class="o sm" onclick="markAll('P')">${t('All')} P</button></div><table id="at"></table></div><div id="rep"></div>`;attRows()},
async admin(){const U=await api('users');
 app.innerHTML=`<div class="card"><h4>Users (same username = reset password)</h4><div class="row"><input id="un" placeholder="Username" autocapitalize="none" autocorrect="off"><input id="nm" placeholder="Full name"><input id="pw" placeholder="Password" autocapitalize="none" autocorrect="off"><select id="rl"><option>teacher</option><option>accountant</option><option>admin</option></select><button onclick="addU()">Save user</button></div>
 <table>${U.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${u.role}</td></tr>`).join('')}</table></div>
 <div class="card"><h4>Backup</h4><p><b>Data is stored only in this browser on this device.</b> Download a backup regularly (and keep it safe: it contains password hashes). Clearing browser data erases everything.</p><div class="row"><button onclick="dl()">Download backup</button><label>Restore: <input type="file" accept=".json,.txt,application/json,text/plain" onchange="rs(this)"></label></div></div>`}};
let eid=null;
function rsz(f){return new Promise(r=>{if(!f)return r(null);const i=new Image();i.onload=()=>{const cv=document.createElement('canvas'),k=Math.min(1,160/Math.max(i.width,i.height));cv.width=i.width*k;cv.height=i.height*k;cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);r(cv.toDataURL('image/jpeg',.7))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)})}
async function saveS(){const pic=await rsz(pf.files[0]);await api('students',{id:eid,name:n.value,father:f.value,phone:ph.value,class:c.value,fee:fe.value,disc:di.value,old:ol.value,photo:pic});eid=null;boot()}
async function delS(id){if(await ask('Remove this student from active list?')){await api('students/delete',{id});boot()}}
async function pay(i,old){const s=FL[i],m=old?'old':$('#m').value,due=old?Math.max(0,(s.old||0)-s.oldpaid):Math.max(0,s.fee-(s.disc||0)-s.paid);
 const a=await askVal((old?'OLD dues received from ':'Amount received from ')+s.name,due);if(!a||!(+a>0))return;
 if(+a>due&&!await ask('Amount is more than the due amount. Continue?'))return;
 const r=await api('pay',{student_id:s.id,month:m,amount:a});rcpt(s,m,+a,r,Math.max(0,due-a));boot()}
function modal(x){closeM();const d=document.createElement('div');d.id='md';d.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9';d.innerHTML='<div class="card" style="max-width:520px;width:100%;max-height:90vh;overflow:auto">'+x+'</div>';document.body.appendChild(d)}
function closeM(){const d=$('#md');if(d)d.remove()}
function printEl(id){let s=document.getElementById('prs');if(!s){s=document.createElement('style');s.id='prs';s.textContent='#pr{display:none}@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;font-family:sans-serif;padding:12px}#pr .wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:-1;pointer-events:none}#pr .wm img{max-width:65%;max-height:60vh;opacity:.08}}';document.head.appendChild(s)}
 let d=document.getElementById('pr');if(d)d.remove();d=document.createElement('div');d.id='pr';d.innerHTML=wmark()+(id=='cvp'||id=='vprint'?'':brandHdr())+document.getElementById(id).innerHTML;document.body.appendChild(d);
 const done=()=>{d.remove();removeEventListener('afterprint',done)};addEventListener('afterprint',done);
 try{window.print()}catch(e){alert('Print is not supported here. Open this file in Chrome.')}}
async function hist(i){const s=FL[i],hx=await api('history?id='+s.id),adm=ROLE=='admin';
 modal(`<h4>${esc(s.name)} - fee history</h4><table><tr><th>#</th><th>Date</th><th>For</th><th>Amount</th>${adm?'<th></th>':''}</tr>`+(hx.map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${x.month=='old'?'Old dues':x.month}</td><td>${x.amount}</td>${adm?`<td><button class="o" onclick="pedit(${x.id},${x.amount})">Edit</button> <button class="r sm" onclick="pdel(${x.id})">Delete</button></td>`:''}</tr>`).join('')||'<tr><td colspan=5>No payments yet</td></tr>')+`</table><div class="row"><button class="o" onclick="closeM()">Close</button></div>`)}
async function pedit(id,a){const v=await askVal('Correct amount',a);if(!v)return;await api('pay/edit',{id,amount:v});closeM();boot()}
async function pdel(id){if(await ask('Delete this payment entry?')){await api('pay/delete',{id});closeM();boot()}}
function mark(id,x){AL.find(s=>s.id==id).status=x;attRows()}
async function saveA(){await api('attendance',{date:$('#d').value,marks:AL.filter(s=>s.status&&(s.class||'')===AC).map(s=>({id:s.id,status:s.status}))});alert('Saved')}
async function addU(){await api('users',{username:un.value,name:nm.value,password:pw.value,role:rl.value});alert('Saved: '+un.value.trim().toLowerCase());boot()}
function dl(){D.lastBackup=Date.now();save();dmcGet(new Blob([JSON.stringify(D)],{type:'application/json'}),'school-backup-'+today()+'.json')}
async function rs(e){const f=e.files[0];if(!f)return;const ok=await ask('Restore will REPLACE all current data. Continue?');if(!ok){e.value='';return}f.text().then(t=>{try{const x=JSON.parse(t);if(!x.users||!x.students)throw 0;D=x;save();logout()}catch{alert('Invalid backup file')}})}

function docPrep(f){return new Promise((res,rej)=>{if(f.type=='application/pdf'){if(f.size>2.5e6){rej('PDF is larger than 2.5 MB');return}const r=new FileReader();r.onload=()=>res({data:r.result,mime:'application/pdf'});r.onerror=()=>rej('Could not read the file');r.readAsDataURL(f);return}
 if(!/^image\//.test(f.type)){rej('Only photos or PDF files are allowed');return}
 const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);res({data:cv.toDataURL('image/jpeg',.75),mime:'image/jpeg'})};i.onerror=()=>rej('Could not read this image');i.src=URL.createObjectURL(f)})}

 const r=bar&&bar.querySelector('.row');if(r)r.innerHTML=`<button onclick="pSave()">${t('Save')}</button><button class="o" onclick="pSave(1);pPro(PE)">👁 ${t('Pro view')}</button><button class="o" onclick="pSave(1);pDown(PE)">⬇ ${t('Download')}</button><button class="o" onclick="pSave(1);pPro(PE,1)">${t('Answer key')}</button><button class="o" onclick="pSave(1);pClose()">${t('Close')}</button>`};
// ---- saved papers list: View and Download are separate ----
window.papList=()=>{app.querySelectorAll('button[onclick^="pPdf(D.papers.find"]').forEach(b=>{const m=b.getAttribute('onclick').match(/x\.id==(\d+)\)\)(,1\))?/);if(!m||m[2])return;b.outerHTML=`<button class="o sm" onclick="pProL(${m[1]})">👁 ${t('View')}</button><button class="o sm" onclick="pDownL(${m[1]})">⬇ ${t('Download')}</button>`});
 app.querySelectorAll('button[onclick^="pPdf(D.papers.find"]').forEach(b=>{const m=b.getAttribute('onclick').match(/x\.id==(\d+)\)\),1\)/);if(m)b.setAttribute('onclick',`pProL(${m[1]},1)`)})};
})();


// ===== Admin Help Assistant: offline, no internet, admin only =====
(()=>{
const KB=[
{k:'pass|pwd|پاس|पास|كلمة|كلمه|bhool|bhul|bhol|forgot|forget|بھول|भूल|reset|ری سیٹ|login|لاگ|लॉग|nahi khul|نہیں کھل',
e:`Forgot a password?
• Teacher/accountant: Admin → Teachers → Reset password, or Users & Backup → type the same username + a new password → Save user. Give them the new password.
• Admin forgot own password: another admin can reset it the same way. Passwords are stored scrambled (hash), so nobody can read the old one. If you are the only admin, Restore an older backup in which you know the password (data after that backup is lost).
• Tip: create a second admin user now and keep backups.`,
r:`Password bhool gaye?
• Teacher/accountant: Admin → Teachers → Reset password dabayen, ya Users & Backup mein wahi username aur naya password likh kar Save user dabayen. Naya password unhein bata dein.
• Admin khud bhool jaye: doosra admin isi tarah reset kar de. Password chhupa kar (hash) rakhe jate hain, purana koi nahi dekh sakta. Agar sirf ek admin hai to purana backup Restore karein jis ka password yaad ho (us ke baad ka data nahi aayega).
• Mashwara: abhi ek doosra admin user bana lein aur backup lete rahein.`,
u:`پاس ورڈ بھول گئے؟
• استاد/اکاؤنٹنٹ: Admin ← Teachers ← Reset password دبائیں، یا Users & Backup میں وہی username اور نیا پاس ورڈ لکھ کر Save user دبائیں۔ نیا پاس ورڈ انہیں بتا دیں۔
• ایڈمن خود بھول جائے: دوسرا ایڈمن اسی طرح ری سیٹ کر دے۔ پاس ورڈ چھپا کر (hash) رکھے جاتے ہیں، پرانا کوئی نہیں دیکھ سکتا۔ اگر ایک ہی ایڈمن ہے تو پرانا بیک اپ Restore کریں جس کا پاس ورڈ یاد ہو (اس کے بعد کا ڈیٹا نہیں آئے گا)۔
• مشورہ: ابھی ایک دوسرا ایڈمن یوزر بنا لیں اور بیک اپ لیتے رہیں۔`},
{k:'backup|back up|restore|بیک|बैकअप|data (lost|gaya|delete)|ڈیٹا|डेटा|new phone|naya phone|نیا فون|نسخ',
e:`Data lives only in this phone's browser.
• Backup: Users & Backup → Download backup (weekly). Keep the file in WhatsApp/Drive.
• New phone or data lost: Users & Backup → Restore → pick the backup file. Restore REPLACES all current data.
• Never clear browser data without a backup.`,
r:`Data sirf isi phone ke browser mein hai.
• Backup: Users & Backup → Download backup (har hafte). File WhatsApp/Drive mein rakhein.
• Naya phone ya data khatam: Users & Backup → Restore → backup file chunein. Restore maujooda sara data badal deta hai.
• Backup ke baghair browser ka data kabhi saaf na karein.`,
u:`ڈیٹا صرف اسی فون کے براؤزر میں ہے۔
• بیک اپ: Users & Backup ← Download backup (ہفتے میں ایک بار)، فائل واٹس ایپ/ڈرائیو میں رکھیں۔
• نیا فون یا ڈیٹا ختم: Users & Backup ← Restore ← بیک اپ فائل چنیں۔ Restore موجودہ سارا ڈیٹا بدل دیتا ہے۔
• بیک اپ کے بغیر براؤزر کا ڈیٹا کبھی صاف نہ کریں۔`},
{k:'user|صارف|यूजर|role|permission|audit|اجازت|accountant|نیا یوزر|account ban',
e:`Users & Backup → enter Username, Full name, Password → choose role (teacher / accountant / admin) → Save user. Same username again = new password.
The Permissions portal sets what each role can open; Audit log shows who did what.`,
r:`Users & Backup → Username, Full name, Password likhein → role chunein (teacher / accountant / admin) → Save user. Wahi username dobara likhein to password naya ho jata hai.
Permissions portal mein har role ki ijazat set hoti hai, aur Audit log mein dekh sakte hain kisne kya kiya.`,
u:`Users & Backup کھولیں ← Username، Full name، Password لکھیں ← role چنیں (teacher / accountant / admin) ← Save user۔ وہی username دوبارہ لکھیں تو پاس ورڈ نیا ہو جاتا ہے۔
Permissions پورٹل میں ہر role کی اجازتیں طے ہوتی ہیں، اور Audit log میں دیکھ سکتے ہیں کس نے کیا کیا۔`},
{k:'id card|idcard|student card|teacher card|staff card|service card|identity|qr|signature|sign|دستخط|شناختی|आईडी कार्ड|id کارڈ|dastkhat',
e:`ID Cards (Home → Students & Parents → ID Cards). Easiest way: 1) tap a student's name, 2) the whole card (front + back) opens, 3) tap Download PDF (or Print). In the card window you can also tap Edit details, or Change photo (camera or gallery).\n• Edit details: type name, father, class, phone, date of birth, blood group, emergency phone, address, and extra lines for the QR code (one per line). Save shows the card again.\n• Import from Excel/CSV: open 'Import card data', Download template, fill it in Excel, choose the file; people are matched by ID or name and their date of birth, blood group, emergency phone, address and QR note are added. Check the list, then Apply to cards.\n• Card language: English / اردو / العربية at the top (for Urdu/Arabic type the school name, address and principal name in Card settings). Principal signature: Card settings → Choose signature file; it is cropped and fitted automatically.\n• The QR code (back of the card only) also holds the last exam: marks, percentage and class position. Many cards at once: tick people (or pick a class), choose Front / Back / Pairs, Save PDF. Cards print in real size (85.6 × 54 mm): one A4 page holds 9 student cards or 10 teacher cards (3 pairs / 5 pairs in Pairs mode) and the rest go to the next page; the bar shows how many pages. Print on A4 with Scale 100% / Actual size, margins none, headers and footers off. Use the 📏 Print size test page first: its ruler must measure exactly 100 mm.`,
r:`ID Cards (Home → Students & Parents → ID Cards). Sab se aasan tareeqa: 1) student ka naam dabayen, 2) poora card (front + back) khul jata hai, 3) Download PDF (ya Print) dabayen. Card ki window mein Edit details aur Change photo (camera ya gallery) bhi hain.\n• Edit details: naam, walid ka naam, class, phone, tareekh-e-paidaish, blood group, emergency phone, pata aur QR ke liye extra lines (har line alag) likhein. Save karne par card dobara nazar aata hai.\n• Excel/CSV se import: 'Import card data' kholein, Download template, Excel mein bharein, file chunein; log ID ya naam se milte hain aur unki tareekh-e-paidaish, blood group, emergency phone, pata aur QR note shamil ho jate hain. List dekh kar Apply to cards dabayen.\n• Card ki zaban: upar English / اردو / العربية (Urdu/Arabic ke liye Card settings mein school ka naam, pata aur principal ka naam likhein). Principal ke dastkhat: Card settings → Choose signature file; khud kat kar munasib size mein aate hain.\n• QR code (sirf card ke peeche) mein aakhri exam ke marks, percentage aur class position bhi hoti hai. Bohat se cards ek saath: log tick karein (ya class chunein), Front / Back / Pairs chunein, Save PDF. Cards asli size (85.6 × 54 mm) mein print hote hain: ek A4 page par 9 student cards ya 10 teacher cards (Pairs mein 3 / 5 jode) aate hain aur baqi agle page par chale jate hain; neeche bar mein pages ki tadad nazar aati hai. A4 par Scale 100% / Actual size, margins none aur headers-footers band rakh kar print karein. Pehle 📏 Print size test page nikalein: us ka ruler theek 100 mm ana chahiye.`,
u:`ID Cards (Home ← Students & Parents ← ID Cards)۔ سب سے آسان طریقہ: 1) طالب علم کا نام دبائیں، 2) پورا کارڈ (آگے + پیچھے) کھل جاتا ہے، 3) Download PDF (یا Print) دبائیں۔ کارڈ کی ونڈو میں Edit details اور Change photo (کیمرہ یا گیلری) بھی ہیں۔\n• Edit details: نام، والد کا نام، کلاس، فون، تاریخ پیدائش، بلڈ گروپ، ایمرجنسی فون، پتہ اور QR کے لیے اضافی سطریں (ہر سطر الگ) لکھیں۔ Save کرنے پر کارڈ دوبارہ نظر آتا ہے۔\n• ایکسل/CSV سے امپورٹ: 'Import card data' کھولیں، Download template، ایکسل میں بھریں، فائل چنیں؛ لوگ ID یا نام سے ملتے ہیں اور ان کی تاریخ پیدائش، بلڈ گروپ، ایمرجنسی فون، پتہ اور QR نوٹ شامل ہو جاتے ہیں۔ فہرست دیکھ کر Apply to cards دبائیں۔\n• کارڈ کی زبان: اوپر English / اردو / العربية (اردو/عربی کے لیے Card settings میں اسکول کا نام، پتہ اور پرنسپل کا نام لکھیں)۔ پرنسپل کے دستخط: Card settings ← Choose signature file؛ خود کٹ کر مناسب سائز میں آتے ہیں۔\n• QR کوڈ (صرف کارڈ کی پچھلی طرف) میں آخری امتحان کے نمبر، فیصد اور کلاس پوزیشن بھی ہوتی ہے۔ کئی کارڈ ایک ساتھ: لوگوں پر ٹک لگائیں (یا کلاس چنیں)، Front / Back / Pairs چنیں، Save PDF۔ کارڈ اصل سائز (85.6 × 54 ملی میٹر) میں پرنٹ ہوتے ہیں: ایک A4 صفحے پر 9 طلبہ کارڈ یا 10 اساتذہ کارڈ (Pairs میں 3 / 5 جوڑے) آتے ہیں اور باقی اگلے صفحے پر چلے جاتے ہیں؛ نیچے بار میں صفحات کی تعداد نظر آتی ہے۔ A4 پر Scale 100% / Actual size، مارجن نہیں اور ہیڈر فوٹر بند رکھ کر پرنٹ کریں۔ پہلے 📏 Print size test صفحہ نکالیں: اس کا رولر ٹھیک 100 ملی میٹر آنا چاہیے۔`},
{k:'student|طلبہ|طالب|طلباء|विद्यार्थी|छात्र|bacha|bache|بچ|admission|داخلہ|dakhla|promote|jamaat|جماعت|excel',
e:`Students portal → Add student: name, father name, phone, class, monthly fee, discount, old dues, photo → Save. Use Search to find a student and edit from the row. At year end use Promote classes to move everyone up.`,
r:`Students portal → Add student: naam, walid ka naam, phone, class, mahana fee, discount, purana baqaya, photo → Save. Search se student dhoondein aur uski row se edit karein. Saal ke aakhir mein Promote classes se sab ki jamaat aage barhayen.`,
u:`Students پورٹل ← Add student: نام، والد کا نام، فون، کلاس، ماہانہ فیس، رعایت، پرانا بقایا، تصویر ← Save۔ Search سے طالب علم ڈھونڈیں اور اس کی قطار سے ایڈٹ کریں۔ سال کے آخر میں Promote classes سے سب کی جماعت آگے بڑھائیں۔`},
{k:'fee|فیس|फीस|rasid|receipt|رسید|voucher|وچر|defaulter|baqaya|bakaya|بقایا|dues|discount|payment|ادائیگی',
e:`Fees portal → pick the month at the top → record each student's payment → a receipt is made (print/PDF, can be sent on WhatsApp). Remind all sends reminders to defaulters. Vouchers portal makes fee vouchers. Discount and old dues come from the student's record.`,
r:`Fees portal → upar se mahina chunein → har student ki payment darj karein → receipt banti hai (print/PDF, WhatsApp par bhi). Remind all se baqaya walon ko yaad-dihani jati hai. Vouchers portal mein fee voucher bante hain. Discount aur purana baqaya student ke record se aate hain.`,
u:`Fees پورٹل ← اوپر سے مہینہ چنیں ← ہر طالب علم کی ادائیگی درج کریں ← رسید بنتی ہے (پرنٹ/PDF، واٹس ایپ پر بھی)۔ Remind all سے بقایا داروں کو یاد دہانی جاتی ہے۔ Vouchers پورٹل میں فیس وچر بنتے ہیں۔ رعایت اور پرانا بقایا طالب علم کے ریکارڈ سے آتے ہیں۔`},
{k:'attend|حاضری|हाज़िरी|हाजिरी|hazri|hazir|present|absent|غیر حاضر|ghair|حضور',
e:`Attendance portal → choose class and date → mark each student P (present), A (absent) or L (leave). Tap All P first, then change the absentees → Save. Reports are under the list. Teachers see only their own classes.`,
r:`Attendance portal → class aur date chunein → har student par P (hazir), A (ghair hazir), L (chutti) lagayen. Pehle All P dabayen, phir ghair hazir walon ko badlein → Save. Report list ke neeche hai. Teacher sirf apni classes dekhta hai.`,
u:`Attendance پورٹل ← کلاس اور تاریخ چنیں ← ہر طالب علم پر P (حاضر)، A (غیر حاضر)، L (چھٹی) لگائیں۔ پہلے All P دبائیں، پھر غیر حاضر والے بدلیں ← Save۔ رپورٹ فہرست کے نیچے ہے۔ استاد صرف اپنی کلاسیں دیکھتا ہے۔`},
{k:'exam|امتحان|परीक्षा|imtihan|result|نتیجہ|natija|dmc|marks|نمبر|grade|position|datesheet|date sheet|admit|roll no',
e:`Exams portal → New exam: name, subjects, max marks → open it and enter marks → Results show total, grade and position. From there: DMC (PDF), admit cards, datesheet, award list, honour roll/certificates and Statistics. Marks can be imported from Excel. A student fails only if the total percentage is below the passing mark.`,
r:`Exams portal → New exam: naam, subjects, har subject ke max marks → exam khol kar marks bharein → Results mein total, grade aur position aati hai. Yahan se DMC (PDF), admit card, datesheet, award list, honour roll/certificate aur Statistics bante hain. Marks Excel se bhi import ho sakte hain. Student sirf tab fail hota hai jab total percentage passing marks se kam ho.`,
u:`Exams پورٹل ← New exam: نام، مضامین، ہر مضمون کے زیادہ سے زیادہ نمبر ← امتحان کھول کر نمبر بھریں ← Results میں کل نمبر، گریڈ اور پوزیشن آتی ہے۔ یہاں سے DMC (PDF)، رول نمبر سلپ، ڈیٹ شیٹ، ایوارڈ لسٹ، آنر رول/سرٹیفکیٹ اور Statistics بنتے ہیں۔ نمبر Excel سے بھی امپورٹ ہو سکتے ہیں۔ طالب علم صرف تب فیل ہوتا ہے جب کل فیصد پاسنگ مارکس سے کم ہو۔`},
{k:'paper|پیپر|पेपर|question|سوال|sawal|mcq|print size',
e:`Papers portal → New paper (Quick start). Tabs: Details (logo, school name, class, subject, time, marks), Questions, Look (language, writing size, logo background) and 👁 Pro view. In Questions add a section (MCQs, Short, Long, Fill, True/False, Match). To write a question just type it and tap Add: MCQs have four option boxes and a Correct choice; short, fill and true/false take an optional answer; Enter adds the next one. You can still paste many questions at once. Pro view shows the full A4 pages with zoom; Download saves the PDF and Print prints it, so viewing never downloads by itself. There is no picture option.`,
r:`Papers portal → New paper (Quick start). Tabs: Details (logo, school ka naam, class, subject, waqt, marks), Questions, Look (zaban, likhai ka size, logo background) aur 👁 Pro view. Questions mein section chunein (MCQs, Short, Long, Fill, True/False, Match). Sawal likhne ke liye bas likhein aur Add dabayen: MCQ mein chaar option ke dibbe aur Correct ka intekhab hai; short, fill aur true/false mein jawab likhna zaruri nahi; Enter se agla sawal add hota hai. Bohat se sawal ek saath paste bhi kar sakte hain. Pro view poore A4 pages zoom ke saath dikhata hai; Download PDF save karta hai aur Print print karta hai, yani dekhne se khud ba khud download nahi hota. Picture ka option nahi hai.`,
u:`Papers پورٹل ← New paper (Quick start)۔ ٹیبز: Details (لوگو، اسکول کا نام، کلاس، مضمون، وقت، نمبر)، Questions، Look (زبان، لکھائی کا سائز، لوگو بیک گراؤنڈ) اور 👁 Pro view۔ Questions میں سیکشن چنیں (MCQs، Short، Long، Fill، True/False، Match)۔ سوال لکھنے کے لیے بس لکھیں اور Add دبائیں: MCQ میں چار آپشن کے خانے اور Correct کا انتخاب ہے؛ short، fill اور true/false میں جواب لکھنا ضروری نہیں؛ Enter سے اگلا سوال شامل ہوتا ہے۔ بہت سے سوال ایک ساتھ paste بھی کر سکتے ہیں۔ Pro view پورے A4 صفحات زوم کے ساتھ دکھاتا ہے؛ Download PDF محفوظ کرتا ہے اور Print پرنٹ کرتا ہے، یعنی دیکھنے سے خود بخود ڈاؤن لوڈ نہیں ہوتا۔ تصویر کا آپشن نہیں ہے۔`},
{k:'teacher|استاد|اساتذہ|ustad|ustaad|शिक्षक|टीचर|staff|my class|معلم|مدرس|substitute|document',
e:`Teachers portal: add the staff list and documents (CNIC, degree) → Create login (username/password) and give it to the teacher. After login the teacher sees only My Class (own classes), My Profile and Diary. Substitute teacher and late-arrival deduction are in the same portal. Admin can see who hasn't written today's diary.`,
r:`Teachers portal: staff list aur documents (CNIC, degree) darj karein → Create login se username/password bana kar teacher ko dein. Login ke baad teacher sirf My Class (apni classes), My Profile aur Diary dekhta hai. Substitute teacher aur late aane ki katauti isi portal mein hai. Admin dekh sakta hai kis ne aaj ki diary nahi likhi.`,
u:`Teachers پورٹل: استاد کی فہرست اور دستاویزات (CNIC، ڈگری) درج کریں ← Create login سے username/password بنا کر استاد کو دیں۔ استاد لاگ اِن کر کے صرف My Class (اپنی کلاسیں)، My Profile اور Diary دیکھتا ہے۔ متبادل استاد اور دیر سے آنے کی کٹوتی بھی اسی پورٹل میں ہے۔ ایڈمن دیکھ سکتا ہے کس نے آج کی ڈائری نہیں لکھی۔`},
{k:'salary|payroll|tankhwa|tankhah|تنخواہ|वेतन|सैलरी|slip|leave|chutti|chhutti|چھٹی|چھٹیاں|advance',
e:`Payroll portal: salary is calculated from teacher attendance, with advance and late deductions, and a salary slip PDF is made for each teacher. In the Leaves portal a teacher requests leave and admin approves it.`,
r:`Payroll portal: teacher ki attendance se tankhwah khud banti hai, advance aur late ki katauti ke saath, aur har teacher ki salary slip PDF banti hai. Leaves portal mein teacher chutti ki darkhwast deta hai aur admin manzoor karta hai.`,
u:`Payroll پورٹل: استاد کی حاضری سے تنخواہ خود بنتی ہے، ایڈوانس اور دیر کی کٹوتی کے ساتھ، اور ہر استاد کی تنخواہ سلپ PDF بنتی ہے۔ Leaves پورٹل میں استاد چھٹی کی درخواست دیتا ہے اور ایڈمن منظور کرتا ہے۔`},
{k:'notice|اعلان|ailan|नोटिस|timetable|time table|ٹائم|routine|diary|ڈائری|डायरी|homework|ہوم ورک',
e:`Notices: write an announcement for everyone. Timetable: class routine. Diary: teachers write each class's lesson and homework for the day.`,

function lastResult(s){
  try{
    const has=e=>{const m=(D.marks||{})[e.id]&&D.marks[e.id][s.id];return !!m&&Array.from(m).some(v=>v!==''&&v!==null&&v!==undefined&&!isNaN(+v))};
    const ok=(D.exams||[]).filter(e=>(!e.class||e.class==s.class)&&has(e));
    if(!ok.length)return null;
    const lk=ok.filter(e=>e.locked),pool=lk.length?lk:ok,e=pool.reduce((a,b)=>b.id>a.id?b:a);
    const mk=D.marks[e.id]||{};
    const rows=D.students.filter(x=>x.active&&(!e.class||x.class==e.class)).map(x=>{const m=Array.from(mk[x.id]||[]);return{id:x.id,class:x.class,m,t:m.reduce((a,v)=>a+(+v||0),0)}});
    const oE=window.RE,oS=window.RS;let g;window.RE=e;window.RS=rows;try{g=dmcData()}finally{window.RE=oE;window.RS=oS}
    const grp=g.groups.find(z=>z.c==(s.class||'')),r=grp&&grp.L.find(z=>z.id==s.id);if(!r)return null;
    const mm=Array.from(mk[s.id]||[]);
    const subs=e.subjects.map((n,j)=>({n:String(n).slice(0,14),v:(mm[j]===''||mm[j]==null)?'-':mm[j],mx:maxOf(e,j)}));
    return{e,t:r.t,tot:totOf(e),pct:r.pct,pos:r.cp,of:grp.L.length,pass:r.pass,grade:grade(r.pct),subs}
  }catch(err){return null}}

function qrStudent(s){const c=cfg(),e=exI('s',s.id),L=[brandName()||'School','STUDENT ID'];

  a('Name',s.name);a('Father',s.father);a('Class',s.class);a('ID','S-'+pad(s.id));a('Phone',s.phone);
  a('Emergency',e.emerg);a('DOB',fd(e.dob));a('Blood',e.blood);a('Address',e.addr);a('Session',c.session);
  String(e.note||'').split(/\n/).map(x=>cap(x,60)).filter(Boolean).slice(0,3).forEach(x=>L.push(x));
  const r=c.exam!==false?lastResult(s):null;
  if(r){const bl=x=>new TextEncoder().encode(x).length;
    L.push('--- '+cap(r.e.name,30)+' ---','Marks: '+r.t+'/'+r.tot,'Percentage: '+r.pct+'%','Position: '+r.pos+' of '+r.of,'Grade: '+r.grade+' ('+(r.pass?'Pass':'Fail')+')');
    const sub='Subjects: '+r.subs.slice(0,12).map(z=>z.n+' '+z.v+'/'+z.mx).join(', ');
    if(bl(L.join('\n')+'\n'+sub)<=340)L.push(sub)}

/* ---------- A4 sheets ---------- */
const GX=5,GY=4;
/* cards per A4 page: students (54 x 85.6) 3 x 3 = 9; teachers (85.6 x 54) 2 x 5 = 10; "pairs" = front + back side by side */
const PER=(k,mode)=>({cols:mode=='pair'?1:(k=='s'?3:2),rows:k=='s'?3:5});
const pagesFor=(k,n,mode)=>{const g=PER(k,mode);return Math.max(1,Math.ceil(n/(g.cols*g.rows)))};
function sheets(k,items,mode,out){ // out: 'pdf' (px page for PDF) or 'print' (exact mm, page margin 0)
  const port=k=='s',cw=port?54:85.6,ch=port?85.6:54,pair=mode=='pair',gy=port?4:3,{cols,rows}=PER(k,mode),per=cols*rows,pages=[];
  let cells=items.map(it=>{const f=faces(k,it);return pair?`<div style="display:flex;gap:${GX}mm">${f.f}${f.b}</div>`:(mode=='back'?f.b:f.f)});
  const blank=`<div style="width:${cw}mm;height:${ch}mm"></div>`;
  for(let i=0;i<cells.length;i+=per){
    let pg=cells.slice(i,i+per);
    if(mode=='back'){ // mirror every row so duplex printing lines up
      const r=[];for(let j=0;j<pg.length;j+=cols){const row=pg.slice(j,j+cols);while(row.length<cols)row.push(blank);r.push(row.reverse())}
      pg=r.flat()}
    pages.push(pg)}
  const gridH=rows*ch+(rows-1)*gy;
  const grid=pg=>`<div style="display:grid;grid-template-columns:repeat(${cols},max-content);gap:${gy}mm ${GX}mm;justify-content:center;align-content:start">${pg.join('')}</div>`;
  return pages.map((pg,i)=>out=='pdf'
    ?`<div style="width:794px;height:1111px;box-sizing:border-box;padding-top:${((294-gridH)/2).toFixed(1)}mm;background:#fff"><style>${CSS}</style>${grid(pg)}</div>`
    :`<div style="width:210mm;height:296mm;box-sizing:border-box;overflow:hidden;padding-top:${((297-gridH)/2).toFixed(1)}mm;${i<pages.length-1?'page-break-after:always;break-after:page;':''}">${i==0?`<style>${CSS}</style>`:''}${grid(pg)}</div>`)}

  st.textContent='@media print{@page{size:A4 portrait;margin:0}html,body{margin:0!important;padding:0!important}#pr{padding:0!important}#pr .wm{display:none!important}}';
  const d=document.createElement('div');d.id='vprint';d.style.display='none';d.innerHTML=h;document.body.appendChild(d);printEl('vprint');d.remove()}

function idPhoto(f){return new Promise(r=>{if(!f)return r(null);const i=new Image();
  i.onload=()=>{const W=300,H=350,ar=W/H;let sw=i.width,sh=i.height,sx=0,sy=0;
    if(sw/sh>ar){const nw=sh*ar;sx=(sw-nw)/2;sw=nw}else{const nh=sw/ar;sy=Math.max(0,(sh-nh)*.15);sh=nh}
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(i,sx,sy,sw,sh,0,0,W,H);
    URL.revokeObjectURL(i.src);r(cv.toDataURL('image/jpeg',.85))};
  i.onerror=()=>r(null);i.src=URL.createObjectURL(f)})}

/* principal signature: choose a photo/scan from the phone; paper is removed and the signature is cropped to its edges */
function idSign(f){return new Promise(r=>{if(!f)return r(null);const i=new Image();
  i.onload=()=>{try{
    let w=i.naturalWidth||i.width,h=i.naturalHeight||i.height;const k=Math.min(1,1000/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(i,0,0,w,h);URL.revokeObjectURL(i.src);
    const im=g.getImageData(0,0,w,h),d=im.data;let hasA=false;
    for(let p=3;p<d.length;p+=4)if(d[p]<200){hasA=true;break}
    if(!hasA){const hist=new Uint32Array(256);let tot=0;
      for(let p=0;p<d.length;p+=16){hist[Math.round(d[p]*.3+d[p+1]*.59+d[p+2]*.11)]++;tot++}
      let acc=0,bg=255;for(let q=255;q>=0;q--){acc+=hist[q];if(acc>=tot*.1){bg=q;break}}
      const hi=bg-40,lo=bg-100;
      for(let p=0;p<d.length;p+=4){const l=d[p]*.3+d[p+1]*.59+d[p+2]*.11,a=l>=hi?0:l<=lo?255:Math.round((hi-l)/(hi-lo)*255);d[p+3]=a;if(a){d[p]=d[p]*.6|0;d[p+1]=d[p+1]*.6|0;d[p+2]=d[p+2]*.6|0}}}
    g.putImageData(im,0,0);
    const rc=new Uint32Array(h),cc=new Uint32Array(w);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>110){rc[y]++;cc[x]++}
    const mn=Math.max(1,Math.round(Math.min(w,h)*.004));let y0=0,y1=h-1,x0=0,x1=w-1;

    if(y1-y0<3||x1-x0<3)return r(null);
    const pd=Math.round(Math.max(x1-x0,y1-y0)*.03);x0=Math.max(0,x0-pd);y0=Math.max(0,y0-pd);x1=Math.min(w-1,x1+pd);y1=Math.min(h-1,y1+pd);
    const cw=x1-x0+1,ch=y1-y0+1,sc=Math.min(1,500/Math.max(cw,ch)),o=document.createElement('canvas');o.width=Math.max(1,Math.round(cw*sc));o.height=Math.max(1,Math.round(ch*sc));
    o.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,o.width,o.height);r(o.toDataURL('image/png'))
  }catch(err){console.error(err);r(null)}};
  i.onerror=()=>r(null);i.src=URL.createObjectURL(f)})}

const normDate=v=>{v=String(v).trim();let m;
  if(/^\d{5}(\.\d+)?$/.test(v))return new Date(Date.UTC(1899,11,30)+Math.floor(+v)*864e5).toISOString().slice(0,10);
  if(m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(v))return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  if(m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(v))return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  return v};

  const csv='\ufeff'+[H,...rows].map(r=>r.map(q).join(',')).join('\r\n');

    else if(/dob|birth|پیدائش|پیدایش|janam/.test(h))kk='dob';
    else if(/blood|بلڈ|خون/.test(h))kk='blood';
    else if(/emerg|ایمرجنسی|طوارئ/.test(h))kk='emerg';
    else if(/addr|pata|پتہ|پتا/.test(h))kk='addr';
    else if(/note|extra|remark|qr|نوٹ/.test(h))kk='note';
    else if(/class|jamaat|جماعت|کلاس/.test(h))kk='cls';
    else if(/name|naam|نام|student|teacher/.test(h))kk='name';
    if(kk&&!(kk in hm))hm[kk]=i});
  if(!('id' in hm)&&!('name' in hm)){box.innerHTML=`<p style="color:#B3261E">${t('The file needs an ID or Name column in the first row')}</p>`;return}
  const all=k=='s'?D.students.filter(s=>s.active):D.teachers.filter(x=>x.active),allow=k=='s'?['dob','blood','emerg','addr','note']:['blood','note'];
  const nn=v=>String(v||'').toLowerCase().replace(/\s+/g,' ').trim(),g=(r,kk)=>kk in hm?String(r[hm[kk]]??'').trim():'';
  const out=[],miss=[];

    if(Object.keys(d).length)out.push({x,d})});
  window.IDIMP=out;
